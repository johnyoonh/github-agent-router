# Managed by github-agent-router; schema=1
# Delivery protocol=2: one-shot probes; no polling on paid runners.
name: Jules Router
on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [jules-cert-sweep]
permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write
jobs:
  jules:
    # Filter comments before allocating a runner, including our own state comments.
    if: >-
      (github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/jules')) &&
      !startsWith(github.event.issue.title || '', '[App feedback]') &&
      !startsWith(github.event.issue.title || '', '[App report]')
    uses: johnyoonh/github-agent-router/.github/workflows/reusable-router.yml@09278292df911a6914fdfbf9a97fd055e741cd88
    with:
      router_ref: 09278292df911a6914fdfbf9a97fd055e741cd88
      home: auto
      overflow: ""
      allowed_owners: "a,b"
      max_rounds: 2
      auto_review_prs: false
    secrets:
      jules_a_api_key: ${{ secrets.JULES_A_API_KEY }}
      jules_b_api_key: ${{ secrets.JULES_B_API_KEY }}
