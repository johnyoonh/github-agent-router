name: Jules Router

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  jules:
    uses: ./.github/workflows/reusable-router.yml
    with:
      router_ref: ${{ github.workflow_sha }}
      home: auto
      overflow: ""
      allowed_owners: "a,b"
      max_rounds: 2
      auto_review_prs: false
    secrets:
      jules_a_api_key: ${{ secrets.JULES_A_API_KEY }}
      jules_b_api_key: ${{ secrets.JULES_B_API_KEY }}
