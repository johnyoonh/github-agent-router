name: Reusable Jules Router

on:
  workflow_call:
    inputs:
      home:
        description: Default Jules account for unclaimed work (a or b)
        required: true
        type: string
      overflow:
        description: Overflow account for unclaimed work only
        required: false
        default: b
        type: string
      max_rounds:
        description: Maximum autonomous Jules rounds per issue/PR
        required: false
        default: 2
        type: number
      auto_review_prs:
        description: Route all eligible PRs without requiring jules:run
        required: false
        default: false
        type: boolean
    secrets:
      jules_a_api_key:
        required: false
      jules_b_api_key:
        required: false

jobs:
  route:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: johnyoonh/github-agent-router
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Route event
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_JSON: ${{ toJSON(github.event) }}
          JULES_HOME: ${{ inputs.home }}
          JULES_OVERFLOW: ${{ inputs.overflow }}
          JULES_MAX_ROUNDS: ${{ inputs.max_rounds }}
          JULES_AUTO_REVIEW_PRS: ${{ inputs.auto_review_prs }}
          JULES_A_API_KEY: ${{ secrets.jules_a_api_key }}
          JULES_B_API_KEY: ${{ secrets.jules_b_api_key }}
        run: github-agent-router
