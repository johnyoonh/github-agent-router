name: Reusable Jules Router

on:
  workflow_call:
    inputs:
      router_ref:
        description: Reviewed full commit SHA; pin this to the same revision as the reusable workflow
        required: true
        type: string
      home:
        description: Primary executor (auto uses private A / public B)
        required: true
        type: string
      overflow:
        description: Explicit permitted fallback for unclaimed source lookup only
        required: false
        default: ""
        type: string
      allowed_owners:
        description: Comma-separated accounts permitted for existing and new work
        required: false
        default: "a,b"
        type: string
      max_rounds:
        required: false
        default: 2
        type: number
      auto_review_prs:
        required: false
        default: false
        type: boolean
      verification_timeout:
        description: Maximum seconds to hold the PR verification gate open for Jules
        required: false
        default: 1800
        type: number
    secrets:
      router_read_token:
        description: Read-only access to this private source repository for cross-repository checkout
        required: false
      jules_a_api_key:
        required: false
      jules_b_api_key:
        required: false

jobs:
  route:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: jules-router-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Validate immutable source revision
        env:
          ROUTER_REF: ${{ inputs.router_ref }}
        run: python3 -c 'import os,re; assert re.fullmatch("[0-9a-f]{40}", os.environ["ROUTER_REF"]), "router_ref must be a full reviewed commit SHA"'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: johnyoonh/github-agent-router
          ref: ${{ inputs.router_ref }}
          token: ${{ secrets.router_read_token || github.token }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-deps .
      - name: Route event
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_ROUTER_SERIALIZED: "true"
          JULES_HOME: ${{ inputs.home }}
          JULES_OVERFLOW: ${{ inputs.overflow }}
          JULES_ALLOWED_OWNERS: ${{ inputs.allowed_owners }}
          JULES_MAX_ROUNDS: ${{ inputs.max_rounds }}
          JULES_AUTO_REVIEW_PRS: ${{ inputs.auto_review_prs }}
          JULES_A_API_KEY: ${{ secrets.jules_a_api_key }}
          JULES_B_API_KEY: ${{ secrets.jules_b_api_key }}
        run: github-agent-router
      - name: Await Jules certification
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_ROUTER_SERIALIZED: "true"
          JULES_HOME: ${{ inputs.home }}
          JULES_OVERFLOW: ${{ inputs.overflow }}
          JULES_ALLOWED_OWNERS: ${{ inputs.allowed_owners }}
          JULES_MAX_ROUNDS: ${{ inputs.max_rounds }}
          JULES_AUTO_REVIEW_PRS: ${{ inputs.auto_review_prs }}
          JULES_A_API_KEY: ${{ secrets.jules_a_api_key }}
          JULES_B_API_KEY: ${{ secrets.jules_b_api_key }}
        run: github-agent-router watch --timeout "${{ inputs.verification_timeout }}" --interval 30
